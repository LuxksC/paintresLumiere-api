openapi: 3.0.3
info:
  title: Paintres Lumiere API
  description: |
    HTTP API (AWS Lambda + API Gateway). Set **Servers** to your deployed base URL or use a tool that ignores browser CORS (e.g. Postman) if `Try it out` fails from a hosted Swagger page.
  version: 1.0.0

servers:
  - url: https://glj3lixjr7.execute-api.sa-east-1.amazonaws.com

tags:
  - name: System
  - name: Auth
  - name: Users
  - name: Products

paths:
  /status:
    get:
      tags: [System]
      summary: Health check
      operationId: getStatus
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: Server Online!

  /signup:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: Email, CPF, or CNPJ already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Validation error
        '401':
          description: Invalid email or password, or account uses Google sign-in only

  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in with Google (mobile ID token)
      description: |
        Accepts a Google **ID token** from the native iOS/Android SDK. Verifies the token, then finds or creates the user and returns the same `accessToken` JWT as `/login`. When creating a new user, the profile picture URL from Google is automatically stored as the user's `image`.
      operationId: authGoogle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: Validation error or Google sign-in not configured
        '401':
          description: Invalid token or unverified Google email
        '409':
          description: Email already linked to another Google account

  /profile:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          description: Invalid or missing token, or inactive account

  /profile/image:
    post:
      tags: [Users]
      summary: Upload a profile picture
      description: |
        Accepts a `multipart/form-data` request with a single file field named `file`. The API uploads the image directly to S3 and returns the final image URL. The user's profile is updated asynchronously within a few seconds.

        **Not available for accounts linked to Google** — those use the picture provided by Google.

        Allowed types: `image/png`, `image/jpeg`, `image/jpg`, `image/heic`. Max size: **4 MB**.

        > The 4 MB limit (vs 5 MB on the presigned URL flow) exists because API Gateway
        > base64-encodes binary payloads before passing them to Lambda, adding ~33% overhead.
        > A 5 MB file would exceed Lambda's 6 MB event payload limit before the API can run.
      operationId: uploadProfileImage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file (png, jpeg, jpg, heic — max 4 MB)
      responses:
        '200':
          description: OK — image uploaded, profile will reflect the new URL within seconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  image:
                    type: string
                    format: uri
                    description: S3 URL of the uploaded image
        '400':
          description: Missing file, unsupported type, file too large, or account linked to Google
        '401':
          description: Invalid or missing token, or inactive account

  /profile/image/upload-url:
    get:
      tags: [Users]
      summary: Get a presigned URL to upload a profile picture
      description: |
        Returns a presigned S3 POST URL and form fields. The client must upload the image directly to S3 using a `multipart/form-data` POST request, including all returned `fields` alongside the image file.

        **Not available for accounts linked to Google** — those use the picture provided by Google.

        Allowed types: `image/png`, `image/jpeg`, `image/jpg`, `image/heic`. Max size: **5 MB**.

        After a successful upload, the user's `image` field (visible on `GET /profile`) is updated asynchronously within a few seconds.
      operationId: getProfileImageUploadUrl
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: contentType
          required: true
          schema:
            type: string
            enum: [image/png, image/jpeg, image/jpg, image/heic]
          description: MIME type of the image to upload
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUploadResponse'
        '400':
          description: Invalid contentType, or account is linked to Google
        '401':
          description: Invalid or missing token, or inactive account

  /logout:
    post:
      tags: [Auth]
      summary: Logout (client should discard the token)
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or invalid token

  /users/me:
    delete:
      tags: [Users]
      summary: Soft-delete the authenticated user (or target id for admins when path supports it)
      operationId: deleteUserMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Invalid or inactive account
        '403':
          description: Not allowed to delete this user
        '404':
          description: User not found or already deleted

  /products:
    post:
      tags: [Products]
      summary: Create a product
      description: Admin only. The `slug` is auto-generated from the `name`. `thickness` defaults to `3` and `dimensions_unit` defaults to `mm`.
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  slug:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Invalid or missing token
        '403':
          description: Admin access required

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from signup or login (`accessToken`)

  schemas:
    SignUpRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          minLength: 1
        lastname:
          type: string
          maxLength: 255
        type:
          type: string
          enum: [admin, client]
          default: client
        phone:
          type: string
          maxLength: 20
        cpf:
          type: string
          maxLength: 14
        cnpj:
          type: string
          maxLength: 14
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        image:
          type: string
          format: uri
          nullable: true
          description: URL of the user's profile picture

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    GoogleAuthRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
          description: Google ID token (JWT) from the mobile SDK

    ProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [admin, client]
        name:
          type: string
        lastname:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          format: email
        cpf:
          type: string
          nullable: true
        cnpj:
          type: string
          nullable: true
        image:
          type: string
          format: uri
          nullable: true
          description: URL of the user's profile picture

    PresignedUploadResponse:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: S3 endpoint to POST the image to
        fields:
          type: object
          additionalProperties:
            type: string
          description: Form fields that must be included in the multipart/form-data POST alongside the file
        key:
          type: string
          description: S3 object key of the uploaded image

    AccessTokenResponse:
      type: object
      properties:
        accessToken:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ErrorMessage:
      type: object
      properties:
        error:
          type: string

    ValidationError:
      type: object
      description: Field errors from Zod (shape varies by endpoint)
      additionalProperties: true


    CreateProductRequest:
      type: object
      required: [sku, name, category, selling_price, color]
      properties:
        sku:
          type: string
        name:
          type: string
        category:
          type: string
          enum: [names, numbers, images, letters]
        selling_price:
          type: number
          format: float
        color:
          type: string
          enum: [gold, silver, bronze, rose, transparent, black]
        description:
          type: string
        stock_quantity:
          type: integer
          minimum: 0
        discount_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
        production_cost:
          type: number
          format: float
        thickness:
          type: number
          format: float
          default: 3
        barcode:
          type: string
          maxLength: 14
        status:
          type: string
          enum: [active, inactive, out_of_stock]
        height:
          type: number
          format: float
        width:
          type: number
          format: float
        length:
          type: number
          format: float
        dimensions_unit:
          type: string
          default: mm

