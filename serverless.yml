org: luxkas
service: paintresLumiere-api

provider:
  name: aws
  runtime: nodejs20.x
  architecture: arm64
  region: sa-east-1
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    JWT_SECRET: ${env:JWT_SECRET}
    GOOGLE_IOS_CLIENT_ID: ${env:GOOGLE_IOS_CLIENT_ID, ''}
    GOOGLE_ANDROID_CLIENT_ID: ${env:GOOGLE_ANDROID_CLIENT_ID, ''}
    UPLOADS_BUCKET: !Ref UploadsBucket
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: !Join ['', [!GetAtt UploadsBucket.Arn, '/*']]

functions:
  status:
    handler: src/functions/status.handler
    events:
      - httpApi:
          path: /status
          method: GET

  signup:
    handler: src/functions/signup.handler
    events:
      - httpApi:
          path: /signup
          method: POST

  login:
    handler: src/functions/login.handler
    events:
      - httpApi:
          path: /login
          method: POST

  authGoogle:
    handler: src/functions/authGoogle.handler
    events:
      - httpApi:
          path: /auth/google
          method: POST

  profile:
    handler: src/functions/profile.handler
    events:
      - httpApi:
          path: /profile
          method: GET

  uploadProfileImage:
    handler: src/functions/uploadProfileImage.handler
    events:
      - httpApi:
          path: /profile/image
          method: POST

  profileImageUploadUrl:
    handler: src/functions/profileImageUploadUrl.handler
    events:
      - httpApi:
          path: /profile/image/upload-url
          method: GET

  processProfileImage:
    handler: src/functions/processProfileImage.handler
    events:
      - sqs:
          arn: !GetAtt ProfileImagesQueue.Arn
          batchSize: 1

  logout:
    handler: src/functions/logout.handler
    events:
      - httpApi:
          path: /logout
          method: POST

  deleteUser:
    handler: src/functions/deleteUser.handler
    events:
      - httpApi:
          path: /users/me
          method: DELETE

  getProducts:
    handler: src/functions/getProducts.handler
    events:
      - httpApi:
          path: /products
          method: GET

  getPopularProducts:
    handler: src/functions/getPopularProducts.handler
    events:
      - httpApi:
          path: /products/popular
          method: GET

  createProduct:
    handler: src/functions/createProduct.handler
    events:
      - httpApi:
          path: /products
          method: POST

  getProductBySku:
    handler: src/functions/getProductBySku.handler
    events:
      - httpApi:
          path: /products/sku/{sku}
          method: GET

  updateProduct:
    handler: src/functions/updateProduct.handler
    events:
      - httpApi:
          path: /products/{id}
          method: PUT

  deleteProduct:
    handler: src/functions/deleteProduct.handler
    events:
      - httpApi:
          path: /products/{id}
          method: DELETE

  uploadProductImage:
    handler: src/functions/uploadProductImage.handler
    events:
      - httpApi:
          path: /products/{productId}/images
          method: POST

  processProductImage:
    handler: src/functions/processProductImage.handler
    events:
      - sqs:
          arn: !GetAtt ProductImagesQueue.Arn
          batchSize: 1

resources:
  Resources:
    ProfileImagesQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: paintres-lumiere-profile-images-queue-dlq

    ProfileImagesQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: paintres-lumiere-profile-images-queue
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ProfileImagesQueueDLQ.Arn
          maxReceiveCount: 3

    ProfileImagesQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ProfileImagesQueue.Arn
              Condition:
                ArnLike:
                  aws:SourceArn: arn:aws:s3:::paintres-lumiere-uploads
        Queues:
          - !Ref ProfileImagesQueue

    ProductImagesQueueDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: paintres-lumiere-product-images-queue-dlq

    ProductImagesQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: paintres-lumiere-product-images-queue
        VisibilityTimeout: 60
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ProductImagesQueueDLQ.Arn
          maxReceiveCount: 3

    ProductImagesQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt ProductImagesQueue.Arn
              Condition:
                ArnLike:
                  aws:SourceArn: arn:aws:s3:::paintres-lumiere-uploads
        Queues:
          - !Ref ProductImagesQueue

    UploadsBucket:
      Type: AWS::S3::Bucket
      DependsOn:
        - ProfileImagesQueuePolicy
        - ProductImagesQueuePolicy
      Properties:
        BucketName: paintres-lumiere-uploads
        # Product images are catalog content and must be readable by the apps (see UploadsBucketPolicy
        # below). ACLs stay blocked — public read is granted by bucket policy on one prefix only.
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        NotificationConfiguration:
          QueueConfigurations:
            - Event: 's3:ObjectCreated:*'
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: profile-images/
              Queue: !GetAtt ProfileImagesQueue.Arn
            - Event: 's3:ObjectCreated:*'
              Filter:
                S3Key:
                  Rules:
                    - Name: prefix
                      Value: product-images/
              Queue: !GetAtt ProductImagesQueue.Arn

    # Public read on product-images/ only. profile-images/ stays private: profile pictures are
    # personal data and must not be world-readable.
    UploadsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref UploadsBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: PublicReadProductImages
              Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Join ['', [!GetAtt UploadsBucket.Arn, '/product-images/*']]
